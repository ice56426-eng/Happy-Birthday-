<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Neish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #2b3bff;
    --pink: #ff4fa3;
    --yellow: #ffd23f;
    --mint: #3ddc97;
    --white: #ffffff;
    --font: "Bricolage Grotesque", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--blue);
    color: var(--white);
    font-family: var(--font);
    overflow: hidden;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  canvas#confetti {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  #intro h1 {
    font-size: clamp(2.6rem, 12vw, 6.5rem);
    line-height: .95; margin: 0 0 .4em; font-weight: 800; letter-spacing: -0.02em;
  }
  #intro h1 .name { color: var(--yellow); display: block; }
  #open {
    appearance: none; border: 0; cursor: pointer;
    background: var(--pink); color: var(--white);
    font: 800 1.25rem var(--font);
    padding: 18px 34px; border-radius: 999px;
    box-shadow: 0 8px 0 #c42d77;
    transition: transform .12s, box-shadow .12s;
  }
  #open:hover { transform: translateY(2px); box-shadow: 0 6px 0 #c42d77; }
  #open:active { transform: translateY(8px); box-shadow: 0 0 0 #c42d77; }
  #open:focus-visible { outline: 4px solid var(--yellow); outline-offset: 4px; }
  #intro.shake h1 { animation: shake .5s ease-in-out; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-12px) rotate(-2deg); }
    40% { transform: translateX(12px) rotate(2deg); }
    60% { transform: translateX(-9px) rotate(-1deg); }
    80% { transform: translateX(9px) rotate(1deg); }
  }
  #intro.gone { display: none; }

  #message { display: none; background: var(--blue); overflow-y: auto; justify-content: safe center; }
  #message.show { display: flex; }
  #message .photo {
    display: block; width: 100%; height: auto;
    margin: 0 0 1.1em; border-radius: 18px;
    border: 5px solid var(--white);
    box-shadow: 8px 8px 0 var(--pink);
    transform: rotate(-1.5deg);
  }
  #message .card {
    max-width: 34rem; text-align: left;
    animation: pop .55s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #message h2 {
    font-size: clamp(2.2rem, 9vw, 4.2rem); line-height: 1; margin: 0 0 .5em;
    font-weight: 800; letter-spacing: -0.02em; color: var(--yellow);
  }
  #message p { font-size: clamp(1.1rem, 4.4vw, 1.5rem); line-height: 1.45; margin: 0 0 .9em; }
  #message p.sign { font-weight: 800; color: var(--mint); font-size: clamp(1.3rem, 5vw, 1.8rem); margin-top: 1em; }
  .hint { margin-top: 1.5em; padding-bottom: 12px; text-align: center; font-size: .9rem; opacity: .7; }

  @media (prefers-reduced-motion: reduce) {
    #intro.shake h1, #message .card { animation: none; }
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<main id="intro" class="screen">
  <h1>Happy Birthday,<span class="name">Neish</span></h1>
  <button id="open" type="button">Open me</button>
</main>

<main id="message" class="screen" aria-live="polite">
  <div class="card">

  <div class="hint">tap anywhere for more confetti</div>
</main>

<script>
(function () {
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var colors = ['#ff4fa3', '#ffd23f', '#3ddc97', '#ffffff', '#7ad7ff', '#ff8a3d'];
  var pieces = [];
  var running = false;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function burst(x, y, count, power) {
    if (reduce) count = Math.ceil(count / 4);
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = (Math.random() * 0.6 + 0.4) * power;
      pieces.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - power * 0.25,
        w: Math.random() * 9 + 6,
        h: Math.random() * 5 + 4,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.4,
        color: colors[(Math.random() * colors.length) | 0],
        round: Math.random() < 0.25,
        life: 0,
        max: 160 + Math.random() * 90
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = pieces.length - 1; i >= 0; i--) {
      var p = pieces[i];
      p.vx *= 0.985;
      p.vy = p.vy * 0.985 + 0.22;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      var fade = p.life > p.max - 40 ? Math.max(0, (p.max - p.life) / 40) : 1;
      if (p.life >= p.max || p.y > window.innerHeight + 40) { pieces.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.h, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (pieces.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }

  var intro = document.getElementById('intro');
  var message = document.getElementById('message');
  var btn = document.getElementById('open');
  var opened = false;

  btn.addEventListener('click', function () {
    if (opened) return;
    opened = true;
    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    if (!reduce) intro.classList.add('shake');
    setTimeout(function () {
      burst(cx, cy, 220, 16);
      burst(window.innerWidth * 0.15, window.innerHeight, 90, 20);
      burst(window.innerWidth * 0.85, window.innerHeight, 90, 20);
      intro.classList.add('gone');
      message.classList.add('show');
      setTimeout(function () { burst(window.innerWidth / 2, window.innerHeight * 0.35, 160, 14); }, 350);
      setTimeout(function () { burst(window.innerWidth * 0.2, window.innerHeight * 0.3, 90, 12); burst(window.innerWidth * 0.8, window.innerHeight * 0.3, 90, 12); }, 800);
    }, reduce ? 0 : 450);
  });

  message.addEventListener('pointerdown', function (e) {
    burst(e.clientX, e.clientY, 90, 12);
  });
})();
</script>
